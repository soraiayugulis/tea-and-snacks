# Test Configuration - Uses Dev Services (Testcontainers)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:15
quarkus.datasource.devservices.port=5432
quarkus.datasource.devservices.db-name=catalogo
quarkus.hibernate-orm.database.generation=drop-and-create

# Disable testcontainers reuse to ensure clean state
quarkus.devservices.reuse=false

# JWT Configuration for tests (using classpath protocol)
mp.jwt.verify.publickey.location=classpath:META-INF/resources/publicKey.pem
smallrye.jwt.sign.key.location=classpath:META-INF/resources/privateKey.pem

# Security - disable auth for integration tests
# Override the authenticated permission from main config
quarkus.http.auth.permission.authenticated.paths=
quarkus.http.auth.permission.public.paths=/*
quarkus.http.auth.permission.public.policy=permit

# Logging
quarkus.log.console.level=WARN

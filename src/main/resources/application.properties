quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/catalogo
quarkus.hibernate-orm.database.generation=update
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n
database.generation=update

# Swagger/OpenAPI Configuration
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/q/swagger-ui

# Swagger UI Customization
quarkus.swagger-ui.doc-expansion=none
quarkus.swagger-ui.default-models-expand-depth=-1
quarkus.swagger-ui.default-model-expand-depth=-1
quarkus.swagger-ui.show-extensions=false
quarkus.swagger-ui.show-common-extensions=false
quarkus.swagger-ui.filter=true

# JWT Configuration
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=https://maddoxbar.com
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
mp.jwt.token.header=Authorization
mp.jwt.token.cookie=jwt

# Security
quarkus.http.auth.permission.public.paths=/auth/*,/api/seed/*,/q/*,/openapi,/swagger-ui/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
